name: Build & Publish Guix Container to GHCR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    # Daily at 06:00 UTC: rebuilds with latest Guix substitutes (qbittorrent-nox, wireguard-tools, ffmpeg, nss-certs)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run AGENTS.md Verification Ladder (Tests, Clippy, Fmt)
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo fmt --all -- --check

      - name: Build static pure-Rust Barracuda binaries
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --workspace --target x86_64-unknown-linux-gnu
          mkdir -p prebuilt
          cp target/x86_64-unknown-linux-gnu/release/barracuda-* prebuilt/

      - name: Install GNU Guix
        run: |
          sudo apt-get update
          sudo apt-get install -y guix uidmap
          sudo systemctl start guix-daemon || true

      - name: Pack Reproducible GNU Guix Docker Image
        run: |
          PACK_TAR=$(guix pack -f docker -S /bin=bin -S /etc=etc -S /share=share -m manifest.scm | tail -n1)
          cp "$PACK_TAR" barracuda-guix-docker-x86_64.tar.gz

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Guix Image & Push to ghcr.io/ubermetroid/barracuda:latest
        run: |
          IMAGE_NAME=$(docker load -i barracuda-guix-docker-x86_64.tar.gz | awk -F': ' '/Loaded image:/ {print $2}')
          docker tag "$IMAGE_NAME" ghcr.io/ubermetroid/barracuda:latest
          docker push ghcr.io/ubermetroid/barracuda:latest
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE_NAME" "ghcr.io/ubermetroid/barracuda:${TAG}"
            docker push "ghcr.io/ubermetroid/barracuda:${TAG}"
          fi
