name: Publish GHCR Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load prebuilt GNU Guix tarball from Release & Push to GHCR
        run: |
          curl -fL -o barracuda-guix.tar.gz https://github.com/UberMetroid/barracuda/releases/download/v0.1.0/barracuda-guix-docker-x86_64.tar.gz
          IMAGE_NAME=$(docker load -i barracuda-guix.tar.gz | awk -F': ' '/Loaded image:/ {print $2}')
          docker tag "$IMAGE_NAME" ghcr.io/ubermetroid/barracuda:latest
          docker tag "$IMAGE_NAME" ghcr.io/ubermetroid/barracuda:v0.1.0
          docker push ghcr.io/ubermetroid/barracuda:latest
          docker push ghcr.io/ubermetroid/barracuda:v0.1.0
